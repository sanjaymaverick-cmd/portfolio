[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-v2"
version = "0.1.0"
description = "MERIDIAN V2 — local research and hedge-review desk. Separate from v1. Advisor only."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Meridian Desk" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-dateutil>=2.9",
  "yfinance>=0.2.50",
  "loguru>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]
desktop = ["pywebview>=5.3"]

[project.scripts]
meridian-v2 = "meridian_v2.cli:main"
meridian_v2 = "meridian_v2.cli:main"

[tool.setuptools.packages.find]
include = ["meridian_v2*"]

[tool.setuptools.package-data]
meridian_v2 = [
  "ui/templates/**/*.html",
  "ui/static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
