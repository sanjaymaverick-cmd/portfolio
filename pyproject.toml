[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian"
version = "0.4.0"
description = "Institutional-grade personal equity advisor and monitor for Indian markets."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Meridian Desk" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "loguru>=0.7",
  "httpx>=0.27",
  "python-dateutil>=2.9",
  "yfinance>=0.2.50",
  "plotly>=5.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]
desktop = ["pywebview>=5.3"]
research = [
  "yfinance>=0.2.50",
  "shap>=0.46",
  "xgboost>=2.1",
  "scikit-learn>=1.5",
  "plotly>=5.24",
  "feedparser>=6.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
]

[project.scripts]
meridian = "meridian.cli:main"

[tool.setuptools.packages.find]
include = ["meridian*"]

[tool.setuptools.package-data]
meridian = [
  "ui/templates/**/*.html",
  "ui/static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
